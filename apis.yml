name: FireVisor
description: FireVisor is an AI-based manufacturing analytics platform that helps manufacturers leverage
  their production data beyond traditional defect detection and process control methods. Founded in 2018
  and headquartered in Singapore (with a secondary office in Toronto, Canada), FireVisor works toward
  "self-aware factories powered by artificial intelligence," applying machine learning to manufacturing
  and industrial-automation data. It is a 500 Global portfolio company. As of this profile the public
  firevisor.com site returns a 404 from its load balancer and exposes no public API, developer portal,
  or documentation.
